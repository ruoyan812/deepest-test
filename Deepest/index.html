<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Deepest — Start</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <style>
    /* Start screen uses a subtle dark-blue background (no particles/ruins) */
    html, body { height:100%; margin:0; background: linear-gradient(180deg,#071225 0%, #0b1520 100%); color:#fff; font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial; overflow:hidden; }
    canvas#bg { position:fixed; left:0; top:0; width:100%; height:100%; z-index:0; display:block; pointer-events:none; }
    canvas#game { position:fixed; left:0; top:0; width:100%; height:100%; z-index:1; display:block; pointer-events:none; }
    .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:2; pointer-events:auto; user-select:none; }
    .title { font-weight:800; font-size:clamp(48px,12vw,120px); text-align:center; margin:0; color:#fff; line-height:0.95; }
    .hint { margin-top:12px; color:#ddd; font-size:clamp(14px,2.6vw,22px); animation:subtlePulse 2s ease-in-out infinite; }
    .copyright { position:fixed; left:0; right:0; bottom:12px; text-align:center; color:#9aa; font-size:13px; z-index:2; }
    @keyframes subtlePulse { 0%{transform:translateY(0);opacity:0.95}50%{transform:translateY(4px);opacity:0.6}100%{transform:translateY(0);opacity:0.95} }
    .fade-out { opacity:0; pointer-events:none; transition:opacity .6s ease; }
    /* Auth panel */
    .auth-panel { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:3; pointer-events:auto; }
    .card { background:#fff; color:#111; padding:22px; border-radius:10px; width:min(420px,92%); box-shadow:0 6px 18px rgba(0,0,0,0.6); }
    .row { margin-top:12px; display:flex; flex-direction:column; gap:8px; }
    .btn-row { display:flex; gap:12px; justify-content:center; margin-top:12px; }
    button.gray { background:#2c3e50; color:#fff; border:0; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; gap:8px; box-shadow:0 2px 6px rgba(0,0,0,.3); }
    button.secondary { background:#7f8c8d; border-radius:6px; padding:8px 16px; font-size:14px; box-shadow:0 2px 6px rgba(0,0,0,.3); }
    input[type="text"], input[type="password"] { padding:10px; border-radius:8px; border:1px solid #ccc; background:#fff; color:#111; font-size:16px; outline: none; }
    .note { color:#444; font-size:13px; margin-top:6px; }
    .error { color:#c0392b; font-size:14px; }
    .hidden { display:none; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    label > div.label-line { display:block; margin-bottom:6px; }
    /* spinner */
    .spinner { width:14px; height:14px; border:2px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius:50%; animation:spin .9s linear infinite; display:inline-block; vertical-align:middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* small on-screen hint for controls */
    .controls-hint { position:fixed; left:12px; bottom:12px; z-index:4; color:#ddd; font-size:13px; background: rgba(0,0,0,0.25); padding:8px 10px; border-radius:8px; backdrop-filter: blur(4px); }
  </style>
</head>
<body>
  <!-- background canvas is present but inactive until auth is opened -->
  <canvas id="bg" aria-hidden="true"></canvas>
  <canvas id="game" aria-hidden="false"></canvas>

  <!-- Initial start overlay (plain background, no particles/ruins) -->
  <div id="startOverlay" class="overlay" role="button" aria-label="Start Deepest. Press Space to start or click to start.">
    <h1 class="title">Deepest</h1>
    <div class="hint">press space to start</div>
    <div class="copyright">© 2026 Yanverse 2013 - 2026, 刃XT 2026. All Rights Reserved.</div>
  </div>

  <!-- Auth panel (hidden initially) -->
  <div id="authPanel" class="auth-panel hidden" aria-hidden="true">
    <div class="card" id="authCard" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div id="authContent"></div>
    </div>
  </div>

  <div class="controls-hint">← / A = left &nbsp; ↑ / W / Space = jump &nbsp; → / D = right</div>
  <div class="sr-only" aria-live="polite">Press space to start the game.</div>

  <script src="main.js"></script>
</body>
</html>
